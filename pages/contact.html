<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 短链工厂</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-header { padding: 140px 0 60px; background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); text-align: center; }
        .page-header h1 { font-size: 42px; font-weight: 800; color: var(--secondary); }
        .page-header p { color: var(--text-muted); margin-top: 12px; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 80px 0; }
        .contact-info h2 { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
        .info-item { display: flex; gap: 16px; margin-bottom: 24px; }
        .info-icon { width: 48px; height: 48px; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .info-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .info-item p { font-size: 14px; color: var(--text-muted); }
        .contact-form { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; }
        .contact-form h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="nav-container"><a href="../index.html" class="logo"><span class="logo-icon">🔗</span><span class="logo-text">短链工厂</span></a><div class="nav-links"><a href="../index.html">首页</a><a href="../index.html#features">功能</a><a href="../index.html#pricing">定价</a><a href="contact.html">联系我们</a></div><div class="nav-right"><a href="../index.html" class="btn btn-outline">返回首页</a></div></div></nav>
    <div class="page-header"><h1>联系我们</h1><p>我们期待与您交流</p></div>
    <section class="container">
        <div class="contact-grid">
            <div class="contact-info">
                <h2>联系方式</h2>
                <div class="info-item"><div class="info-icon">📧</div><div><h4>商务邮箱</h4><p>contact@shortlink.com</p></div></div>
                <div class="info-item"><div class="info-icon">📞</div><div><h4>电话咨询</h4><p>400-888-8888</p></div></div>
                <div class="info-item"><div class="info-icon">💬</div><div><h4>在线客服</h4><p>工作日 9:00-18:00</p></div></div>
                <div class="info-item"><div class="info-icon">📍</div><div><h4>公司地址</h4><p>北京市朝阳区科技园区</p></div></div>
            </div>
            <div class="contact-form">
                <h3>发送咨询</h3>
                <form onsubmit="event.preventDefault(); alert('提交成功！我们会尽快联系您。')">
                    <div class="form-row"><input type="text" placeholder="您的姓名" class="form-input" required><input type="email" placeholder="邮箱" class="form-input" required></div>
                    <input type="text" placeholder="公司名称" class="form-input">
                    <select class="form-input"><option>咨询类型</option><option>产品咨询</option><option>商务合作</option><option>技术支持</option><option>其他</option></select>
                    <textarea placeholder="您的需求..." class="form-input" rows="4" required></textarea>
                    <button type="submit" class="btn btn-primary btn-full">提交咨询</button>
                </form>
            </div>
        </div>
    </section>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 短链工厂 All Rights Reserved</p></div></div></footer>
</body>
</html>
