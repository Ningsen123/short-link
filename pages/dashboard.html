<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - 短链工厂</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard { padding: 100px 0 60px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .dashboard-header h1 { font-size: 28px; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .stat-card h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: var(--primary); }
        .links-table { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .table-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; padding: 16px 24px; background: var(--bg); font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .table-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; padding: 16px 24px; border-bottom: 1px solid var(--border); align-items: center; font-size: 14px; }
        .table-row:last-child { border-bottom: none; }
        .link-short { color: var(--primary); font-weight: 600; }
        .link-long { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="nav-container"><a href="../index.html" class="logo"><span class="logo-icon">🔗</span><span class="logo-text">短链工厂</span></a><div class="nav-links"><a href="../index.html">首页</a><a href="dashboard.html">控制台</a><a href="billing.html">订阅</a></div><div class="nav-right"><a href="../index.html" class="btn btn-outline">退出</a></div></div></nav>
    <section class="dashboard container">
        <div class="dashboard-header">
            <h1>📊 我的链接</h1>
            <button class="btn btn-primary" onclick="window.location.href='../index.html'">+ 创建短链</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h4>总链接数</h4><div class="value" id="totalLinks">12</div></div>
            <div class="stat-card"><h4>总点击数</h4><div class="value" id="totalClicks">1,234</div></div>
            <div class="stat-card"><h4>今日点击</h4><div class="value" id="todayClicks">89</div></div>
            <div class="stat-card"><h4>平均CTR</h4><div class="value">3.2%</div></div>
        </div>
        <div class="links-table">
            <div class="table-header"><span>短链接</span><span>原标题</span><span>点击数</span><span>创建时间</span><span>操作</span></div>
            <div class="table-row"><span class="link-short">s.link/AbC123</span><span class="link-long">https://example.com/very-long-url</span><span>456</span><span>2026-05-18</span><span><button class="btn btn-outline btn-sm">统计</button></span></div>
            <div class="table-row"><span class="link-short">s.link/XyZ789</span><span class="link-long">https://google.com/search?q=test</span><span>234</span><span>2026-05-17</span><span><button class="btn btn-outline btn-sm">统计</button></span></div>
            <div class="table-row"><span class="link-short">s.link/Def456</span><span class="link-long">https://github.com/repo/project</span><span>567</span><span>2026-05-16</span><span><button class="btn btn-outline btn-sm">统计</button></span></div>
        </div>
    </section>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 短链工厂 All Rights Reserved</p></div></div></footer>
    <script src="../js/app.js"></script>
</body>
</html>
